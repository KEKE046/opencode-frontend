name: build-gateway

on:
  push:
    branches:
      - dev
    paths:
      - packages/gateway/**
      - packages/app/**
      - packages/ui/**
      - .github/workflows/build-gateway.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: ./.github/actions/setup-bun

      - name: Build gateway
        run: bun run build
        working-directory: packages/gateway

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-gateway-linux-x64
          path: packages/gateway/dist/opencode-gateway
          retention-days: 30
